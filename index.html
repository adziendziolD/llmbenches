<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>llmbenches</title>
<style>
:root {
  --bg: #f7f7f5; --panel: #fff; --ink: #1a1a19; --muted: #6b6b66; --line: #e2e2dd;
  --accent: #2f6f4f; --warn: #9a3412; --warnbg: #fff4ed;
  --c0: #8a8a84; --c1: #4a7fb5; --c2: #2f6f4f; --c3: #a86b2d;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #16171a; --panel: #1e2024; --ink: #e8e8e4; --muted: #9b9b94; --line: #31343a;
    --accent: #6bbd92; --warn: #f0a882; --warnbg: #2a1d17;
    --c0: #7e8189; --c1: #6fa8dc; --c2: #6bbd92; --c3: #d4a05e;
  }
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--ink);
  font: 15px/1.55 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
.wrap { max-width: 1180px; margin: 0 auto; padding-block: 28px; padding-left: 20px; padding-right: 20px; }
header { display: flex; flex-wrap: wrap; gap: 14px; align-items: baseline; justify-content: space-between;
  border-bottom: 2px solid var(--line); padding-bottom: 14px; margin-bottom: 24px; }
h1 { font-size: 21px; margin: 0; letter-spacing: -.01em; }
h2 { font-size: 16px; margin: 32px 0 12px; padding-bottom: 6px; border-bottom: 1px solid var(--line); }
h3 { font-size: 14px; margin: 20px 0 8px; color: var(--muted); font-weight: 600; }
.sub { color: var(--muted); font-size: 13px; }
select, button { font: inherit; padding: 5px 9px; border: 1px solid var(--line); border-radius: 6px;
  background: var(--panel); color: var(--ink); cursor: pointer; }
.panel { background: var(--panel); border: 1px solid var(--line); border-radius: 9px; padding: 16px 18px; }
.grid { display: grid; gap: 14px; grid-template-columns: repeat(auto-fit, minmax(255px, 1fr));
  align-items: start; }
dl { margin: 0; display: grid; grid-template-columns: auto 1fr; gap: 4px 12px; font-size: 13.5px; }
dt { color: var(--muted); white-space: nowrap; }
dd { margin: 0; overflow-wrap: anywhere; }
.chips { display: flex; flex-wrap: wrap; gap: 7px; margin: 14px 0 6px; }
.chip { padding: 4px 11px; border: 1px solid var(--line); border-radius: 999px; background: var(--panel);
  font-size: 13px; cursor: pointer; color: var(--muted); }
.chip[aria-pressed="true"] { background: var(--ink); color: var(--bg); border-color: var(--ink); }
table { border-collapse: collapse; width: 100%; font-size: 13.5px; }
th, td { text-align: right; padding: 6px 9px; border-bottom: 1px solid var(--line); white-space: nowrap; }
th:first-child, td:first-child, th.l, td.l { text-align: left; }
thead th { color: var(--muted); font-weight: 600; font-size: 12.5px; }
tbody tr:hover { background: color-mix(in srgb, var(--line) 45%, transparent); }
tr.group td { padding-top: 14px; font-weight: 600; color: var(--muted); border-bottom: none; }
.num { font-variant-numeric: tabular-nums; }
.best { font-weight: 700; color: var(--accent); }
.fail { color: var(--warn); }
.note { background: var(--warnbg); border-left: 3px solid var(--warn); padding: 10px 14px;
  border-radius: 0 6px 6px 0; margin: 10px 0; font-size: 13.5px; }
ul.notes { padding-left: 18px; font-size: 13.5px; }
ul.notes li { margin-bottom: 7px; }
code, pre { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 12.5px; }
pre { background: var(--bg); border: 1px solid var(--line); border-radius: 6px; padding: 11px 13px;
  overflow-x: auto; margin: 0; }
details { margin-top: 10px; }
summary { cursor: pointer; color: var(--muted); font-size: 13.5px; }
.scroll { overflow-x: auto; }
svg { display: block; width: 100%; height: auto; }
.legend { display: flex; flex-wrap: wrap; gap: 14px; font-size: 13px; color: var(--muted); margin-top: 8px; }
.legend span { display: flex; align-items: center; gap: 6px; }
.sw { width: 11px; height: 11px; border-radius: 3px; display: inline-block; }
.empty { color: var(--muted); font-style: italic; padding: 30px 0; text-align: center; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div>
      <h1>llmbenches</h1>
      <div class="sub" id="gen"></div>
    </div>
    <label class="sub">Messlauf
      <select id="runsel"></select>
    </label>
  </header>
  <main id="app"><div class="empty">Lade Daten&nbsp;…</div></main>
</div>

<script src="data.js"></script>
<script>
const COLORS = ['var(--c0)', 'var(--c1)', 'var(--c2)', 'var(--c3)'];
const $ = (t, a = {}, kids = []) => {
  const e = document.createElement(t);
  for (const [k, v] of Object.entries(a)) {
    if (k === 'html') e.innerHTML = v; else if (k === 'text') e.textContent = v;
    else e.setAttribute(k, v);
  }
  (Array.isArray(kids) ? kids : [kids]).forEach(c => c && e.append(c));
  return e;
};
const svgEl = (t, a = {}) => {
  const e = document.createElementNS('http://www.w3.org/2000/svg', t);
  for (const [k, v] of Object.entries(a)) e.setAttribute(k, v);
  return e;
};
const fmt = (v, d = 2) => v == null ? '–' : v.toFixed(d).replace('.', ',');

let DATA = null, runIdx = 0, scope = 'overall';

/* ---------- Diagramme ---------- */

// Gruppierte Balken mit Spannweite als Fehlerbalken.
// groups: [{label, bars:[{label, value, lo, hi, color, tag}]}]
function barChart(groups, { unit = '', ref = null, refLabel = '' } = {}) {
  const W = 1000, padL = 54, padR = 16, padT = 18, padB = 52;
  const gGap = 44, bGap = 7;
  const nBars = groups.reduce((s, g) => s + g.bars.length, 0);
  const barW = Math.min(66, (W - padL - padR - gGap * (groups.length - 1) - bGap * (nBars - groups.length)) / nBars);
  const H = 330;
  const vals = groups.flatMap(g => g.bars.flatMap(b => [b.hi ?? b.value, b.value])).filter(v => v != null);
  const max = Math.max(...vals, ref ?? 0) * 1.16 || 1;
  const y = v => padT + (H - padT - padB) * (1 - v / max);
  const svg = svgEl('svg', { viewBox: `0 0 ${W} ${H}`, role: 'img' });

  // Gitter
  const step = max > 60 ? 20 : max > 30 ? 10 : max > 12 ? 5 : 1;
  for (let v = 0; v <= max; v += step) {
    svg.append(svgEl('line', { x1: padL, x2: W - padR, y1: y(v), y2: y(v),
      stroke: 'var(--line)', 'stroke-width': 1 }));
    const t = svgEl('text', { x: padL - 8, y: y(v) + 4, 'text-anchor': 'end',
      fill: 'var(--muted)', 'font-size': 12 });
    t.textContent = v; svg.append(t);
  }
  if (ref != null) {
    svg.append(svgEl('line', { x1: padL, x2: W - padR, y1: y(ref), y2: y(ref),
      stroke: 'var(--muted)', 'stroke-width': 1.5, 'stroke-dasharray': '5 4' }));
    const t = svgEl('text', { x: W - padR, y: y(ref) - 6, 'text-anchor': 'end',
      fill: 'var(--muted)', 'font-size': 11.5 });
    t.textContent = refLabel; svg.append(t);
  }

  // Wenige Balken mittig setzen, damit eine einzelne Gruppe nicht links klebt.
  const totalW = nBars * barW + (nBars - groups.length) * bGap + (groups.length - 1) * gGap;
  let x = padL + Math.max(0, (W - padL - padR - totalW) / 2);
  for (const g of groups) {
    const x0 = x;
    for (const b of g.bars) {
      if (b.value != null) {
        svg.append(svgEl('rect', { x, y: y(b.value), width: barW, height: Math.max(0, y(0) - y(b.value)),
          fill: b.color, rx: 3 }));
        if (b.lo != null && b.hi != null && b.hi > b.lo) {
          const cx = x + barW / 2;
          svg.append(svgEl('line', { x1: cx, x2: cx, y1: y(b.lo), y2: y(b.hi),
            stroke: 'var(--ink)', 'stroke-width': 1.3, opacity: .55 }));
          for (const v of [b.lo, b.hi])
            svg.append(svgEl('line', { x1: cx - 5, x2: cx + 5, y1: y(v), y2: y(v),
              stroke: 'var(--ink)', 'stroke-width': 1.3, opacity: .55 }));
        }
        const lbl = svgEl('text', { x: x + barW / 2, y: y(b.hi ?? b.value) - 7, 'text-anchor': 'middle',
          fill: 'var(--ink)', 'font-size': 12, 'font-weight': 600 });
        lbl.textContent = fmt(b.value, unit === '%' ? 1 : 2) + unit;
        svg.append(lbl);
        if (b.tag) {
          const t2 = svgEl('text', { x: x + barW / 2, y: y(b.hi ?? b.value) - 22, 'text-anchor': 'middle',
            fill: 'var(--accent)', 'font-size': 11.5, 'font-weight': 600 });
          t2.textContent = b.tag; svg.append(t2);
        }
      } else {
        const t = svgEl('text', { x: x + barW / 2, y: y(0) - 10, 'text-anchor': 'middle',
          fill: 'var(--warn)', 'font-size': 11.5 });
        t.textContent = '✕'; svg.append(t);
      }
      x += barW + bGap;
    }
    x += gGap - bGap;
    const gl = svgEl('text', { x: (x0 + x - gGap) / 2, y: H - padB + 20, 'text-anchor': 'middle',
      fill: 'var(--ink)', 'font-size': 13, 'font-weight': 600 });
    gl.textContent = g.label; svg.append(gl);
  }
  svg.append(svgEl('line', { x1: padL, x2: W - padR, y1: y(0), y2: y(0), stroke: 'var(--line)', 'stroke-width': 2 }));
  return svg;
}

// Einzelmessungen als Punktwolke, zeigt ob sich Verteilungen ueberlappen.
function scatterChart(series) {
  const W = 1000, padL = 54, padR = 16, padT = 16, padB = 52, H = 300;
  const all = series.flatMap(s => s.values);
  if (!all.length) return $('div', { class: 'empty', text: 'keine Einzelwerte' });
  const max = Math.max(...all) * 1.1, min = Math.min(...all) * .88;
  const y = v => padT + (H - padT - padB) * (1 - (v - min) / (max - min));
  const svg = svgEl('svg', { viewBox: `0 0 ${W} ${H}`, role: 'img' });
  const step = (max - min) > 25 ? 10 : 5;
  for (let v = Math.ceil(min / step) * step; v <= max; v += step) {
    svg.append(svgEl('line', { x1: padL, x2: W - padR, y1: y(v), y2: y(v), stroke: 'var(--line)' }));
    const t = svgEl('text', { x: padL - 8, y: y(v) + 4, 'text-anchor': 'end', fill: 'var(--muted)', 'font-size': 12 });
    t.textContent = v; svg.append(t);
  }
  const colW = (W - padL - padR) / series.length;
  series.forEach((s, i) => {
    const cx = padL + colW * (i + .5);
    if (s.values.length) {
      const lo = Math.min(...s.values), hi = Math.max(...s.values);
      svg.append(svgEl('line', { x1: cx, x2: cx, y1: y(lo), y2: y(hi), stroke: s.color, 'stroke-width': 2, opacity: .3 }));
      svg.append(svgEl('line', { x1: cx - 24, x2: cx + 24, y1: y(s.median), y2: y(s.median),
        stroke: s.color, 'stroke-width': 2.5 }));
      s.values.forEach((v, j) => {
        const jitter = ((j % 5) - 2) * 7;
        svg.append(svgEl('circle', { cx: cx + jitter, cy: y(v), r: 3.4, fill: s.color, opacity: .8 }));
      });
    }
    const t = svgEl('text', { x: cx, y: H - padB + 20, 'text-anchor': 'middle', fill: 'var(--ink)', 'font-size': 12 });
    t.textContent = s.label; svg.append(t);
    const t2 = svgEl('text', { x: cx, y: H - padB + 36, 'text-anchor': 'middle', fill: 'var(--muted)', 'font-size': 11.5 });
    t2.textContent = s.group; svg.append(t2);
  });
  return svg;
}

function legend(items) {
  return $('div', { class: 'legend' }, items.map(i =>
    $('span', {}, [$('i', { class: 'sw', style: `background:${i.color}` }), $('span', { text: i.label })])));
}

/* ---------- Aufbau ---------- */

function cfgList(run) {
  const cfgs = new Set();
  Object.values(run.results).forEach(b => Object.keys(b).forEach(c => cfgs.add(c)));
  return [...cfgs].sort((a, b) =>
    (run.configs?.[a]?.order ?? 99) - (run.configs?.[b]?.order ?? 99) || a.localeCompare(b));
}
const cfgLabel = (run, c) => run.configs?.[c]?.label || c;
const beLabel = (run, b) => run.backends?.[b]?.label || b;
const pick = (entry, scope) => !entry || entry.status !== 'ok' ? null
  : (scope === 'overall' ? entry.overall : entry.prompts?.[scope]);

function render() {
  const run = DATA.runs[runIdx];
  const app = document.getElementById('app');
  app.replaceChildren();
  const backends = Object.keys(run.results);
  const cfgs = cfgList(run);
  const promptIds = Object.keys(run.prompts || {});

  /* Steckbrief */
  app.append($('h2', { text: 'Steckbrief' }));
  if (run.question) app.append($('p', { class: 'sub', text: run.question }));
  const cards = $('div', { class: 'grid' });
  for (const [title, obj] of [['Maschine', run.machine], ['Modell', run.model], ['Methodik', run.method]]) {
    if (!obj) continue;
    const dl = $('dl');
    for (const [k, v] of Object.entries(obj)) { dl.append($('dt', { text: k })); dl.append($('dd', { text: v })); }
    cards.append($('div', { class: 'panel' }, [$('h3', { text: title }), dl]));
  }
  app.append(cards);
  if (run.cmdline) app.append($('details', {}, [$('summary', { text: 'Startzeile' }), $('pre', { text: run.cmdline })]));

  /* Auswahl der Kennzahl */
  app.append($('h2', { text: 'Durchsatz' }));
  const chips = $('div', { class: 'chips' });
  for (const [id, label] of [['overall', 'alle Prompts'], ...promptIds.map(p => [p, p])]) {
    const c = $('button', { class: 'chip', 'aria-pressed': String(scope === id), text: label,
      title: run.prompts?.[id] || '' });
    c.onclick = () => { scope = id; render(); };
    chips.append(c);
  }
  app.append(chips);

  /* Balken: Durchsatz */
  const groups = backends.map(b => ({
    label: beLabel(run, b),
    bars: cfgs.map((c, i) => {
      const e = pick(run.results[b][c], scope);
      return { label: cfgLabel(run, c), value: e?.median ?? null, lo: e?.min, hi: e?.max,
        color: COLORS[i % COLORS.length],
        tag: e && run.results[b][c].speedup && c !== 'baseline'
          ? fmt(scope === 'overall' ? run.results[b][c].speedup : e.speedup, 2) + '×' : null };
    })
  }));
  app.append($('div', { class: 'panel' }, [
    barChart(groups, { unit: ' t/s' }),
    $('div', { class: 'sub', text: 'Balken: Median. Strich: Spannweite von kleinstem bis groesstem Einzelwert. ✕ bedeutet, die Konfiguration lief nicht.' }),
    legend(cfgs.map((c, i) => ({ label: cfgLabel(run, c), color: COLORS[i % COLORS.length] })))
  ]));

  /* Gescheiterte Konfigurationen */
  for (const b of backends) for (const c of cfgs) {
    const e = run.results[b][c];
    if (e && e.status !== 'ok')
      app.append($('div', { class: 'note' }, [
        $('strong', { text: `${beLabel(run, b)} · ${cfgLabel(run, c)} lief nicht: ` }),
        $('code', { text: e.error || 'unbekannt' })]));
  }

  /* Akzeptanz */
  const accGroups = backends.map(b => ({
    label: beLabel(run, b),
    bars: cfgs.filter(c => c !== 'baseline').map((c, i) => {
      const e = pick(run.results[b][c], scope);
      return { label: cfgLabel(run, c), value: e?.acceptance ?? null,
        color: COLORS[(i + 1) % COLORS.length],
        tag: e?.mean_len ? fmt(e.mean_len, 2) + ' Tok' : null };
    })
  })).filter(g => g.bars.some(b => b.value != null));
  if (accGroups.length) {
    app.append($('h2', { text: 'Akzeptanzrate des Drafts' }));
    app.append($('div', { class: 'panel' }, [
      barChart(accGroups, { unit: ' %' }),
      $('div', { class: 'sub', text: 'Anteil der vom Hauptmodell bestaetigten Draft-Tokens. Darueber die mittlere akzeptierte Laenge je Schritt.' })
    ]));
  }

  /* Streuung */
  const series = [];
  for (const b of backends) for (const [i, c] of cfgs.entries()) {
    const e = pick(run.results[b][c], scope);
    if (e) series.push({ label: cfgLabel(run, c).replace('MTP ', ''), group: beLabel(run, b),
      values: e.values, median: e.median, color: COLORS[i % COLORS.length] });
  }
  if (series.length) {
    app.append($('h2', { text: 'Streuung der Einzelmessungen' }));
    app.append($('div', { class: 'panel' }, [
      scatterChart(series),
      $('div', { class: 'sub', text: 'Jeder Punkt eine Messung, waagerechter Strich der Median. Ueberlappen zwei Wolken nicht, ist der Unterschied belastbar.' })
    ]));
  }

  /* Tabelle */
  app.append($('h2', { text: 'Alle Zahlen' }));
  const thead = $('thead', {}, $('tr', {}, [
    $('th', { class: 'l', text: 'Konfiguration' }), $('th', { text: 'min' }), $('th', { text: 'Median' }),
    $('th', { text: 'max' }), $('th', { text: 'Spanne' }), $('th', { text: 'Speedup' }),
    $('th', { text: 'Akzeptanz' }), $('th', { text: 'mittl. Laenge' }), $('th', { text: 'VRAM' })]));
  const tbody = $('tbody');
  for (const b of backends) {
    tbody.append($('tr', { class: 'group' }, $('td', { class: 'l', colspan: 9, text: beLabel(run, b) })));
    const best = Math.max(...cfgs.map(c => pick(run.results[b][c], scope)?.median ?? 0));
    for (const c of cfgs) {
      const raw = run.results[b][c];
      if (!raw) continue;
      if (raw.status !== 'ok') {
        tbody.append($('tr', {}, [$('td', { class: 'l', text: cfgLabel(run, c) }),
          $('td', { class: 'l fail', colspan: 8, text: 'nicht gelaufen' })]));
        continue;
      }
      const e = pick(raw, scope);
      const sp = scope === 'overall' ? raw.speedup : e.speedup;
      const td = (v, cls = 'num') => $('td', { class: cls, text: v });
      tbody.append($('tr', {}, [
        $('td', { class: 'l', text: cfgLabel(run, c) }),
        td(fmt(e.min)), $('td', { class: 'num' + (e.median === best ? ' best' : ''), text: fmt(e.median) }),
        td(fmt(e.max)), td(fmt(e.spread_pct, 1) + ' %'),
        td(sp ? fmt(sp, 3) + '×' : '–'),
        td(e.acceptance != null ? fmt(e.acceptance, 1) + ' %' : '–'),
        td(e.mean_len != null ? fmt(e.mean_len) : '–'),
        td(raw.vram_gib != null ? fmt(raw.vram_gib) + ' GiB' : '–')]));
    }
  }
  app.append($('div', { class: 'panel scroll' }, $('table', {}, [thead, tbody])));

  /* Rohwerte */
  const rawTb = $('tbody');
  for (const b of backends) for (const c of cfgs) {
    const raw = run.results[b][c];
    if (!raw || raw.status !== 'ok') continue;
    for (const pid of Object.keys(raw.prompts)) {
      const e = raw.prompts[pid];
      rawTb.append($('tr', {}, [
        $('td', { class: 'l', text: beLabel(run, b) }), $('td', { class: 'l', text: cfgLabel(run, c) }),
        $('td', { class: 'l', text: pid }),
        $('td', { class: 'num', text: e.values.map(v => fmt(v)).join('   ') }),
        $('td', { class: 'num', text: fmt(e.median) }),
        $('td', { class: 'num', text: e.prompt_tps != null ? fmt(e.prompt_tps, 1) : '–' })]));
    }
  }
  app.append($('details', {}, [$('summary', { text: 'Rohwerte aller Einzelmessungen' }),
    $('div', { class: 'panel scroll', style: 'margin-top:10px' }, $('table', {}, [
      $('thead', {}, $('tr', {}, ['Backend', 'Konfiguration', 'Prompt', 'Einzelwerte t/s', 'Median', 'Prompt t/s']
        .map(h => $('th', { class: 'l', text: h })))), rawTb]))]));

  /* Notizen */
  if (run.notes?.length) {
    app.append($('h2', { text: 'Befunde und Fallstricke' }));
    app.append($('div', { class: 'panel' }, $('ul', { class: 'notes' }, run.notes.map(n => $('li', { text: n })))));
  }
}

function boot(data) {
  DATA = data;
  document.getElementById('gen').textContent =
    `${data.runs.length} Messlauf${data.runs.length === 1 ? '' : 'e'} · Stand ${new Date(data.generated).toLocaleString('de-DE')}`;
  const sel = document.getElementById('runsel');
  data.runs.forEach((r, i) => sel.append($('option', { value: String(i), text: `${r.date || ''} ${r.title || r.id}`.trim() })));
  sel.onchange = () => { runIdx = +sel.value; scope = 'overall'; render(); };
  if (!data.runs.length) { document.getElementById('app').replaceChildren($('div', { class: 'empty', text: 'Keine Messlaeufe in runs/ gefunden. tools/collect.py ausfuehren.' })); return; }
  render();
}

function fail(msg) {
  document.getElementById('app').replaceChildren(
    $('div', { class: 'note' }, [$('strong', { text: 'Fehler: ' }), $('code', { text: String(msg) })]));
}
window.addEventListener('error', e => fail(e.message + ' @ Zeile ' + e.lineno));

function start(data) {
  try { boot(data); } catch (err) { fail(err && err.stack ? err.stack : err); }
}

// data.js wird von collect.py zusammen mit data.json geschrieben und laedt synchron,
// funktioniert also auch per Doppelklick ohne Webserver. Ueber HTTP holen wir danach
// data.json nach, damit ein Neusammeln ohne Neuladen der Seite sichtbar wird.
if (window.BENCH_DATA) start(window.BENCH_DATA);
else fail('Keine Daten gefunden. Erst python3 tools/collect.py ausfuehren.');

if (location.protocol.startsWith('http')) {
  fetch('data.json').then(r => r.ok ? r.json() : null).then(d => {
    if (d && (!DATA || d.generated !== DATA.generated)) {
      document.getElementById('runsel').replaceChildren();
      start(d);
    }
  }).catch(() => {});
}
